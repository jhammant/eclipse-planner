<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>og card</title>
    <style>
      /* Rendered at exactly 1200x630 and screenshotted to public/og.png. */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { background: #05070d; }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: linear-gradient(175deg, #16213a 0%, #0e1526 45%, #1b1a2a 72%, #2a2233 100%);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #e8ecf6;
      }

      /* Low evening sun glow, roughly where the eclipse actually sits. */
      .glow {
        position: absolute;
        left: 745px; top: 150px;
        width: 620px; height: 620px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(255,184,77,0.30) 0%, rgba(255,150,60,0.10) 38%, rgba(255,150,60,0) 68%);
      }

      .eclipse {
        position: absolute;
        left: 745px; top: 150px;
        width: 190px; height: 190px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, #fff6dc, #ffc266 62%, #f0973a);
        box-shadow: 0 0 90px 18px rgba(255, 184, 77, 0.42);
      }

      /* The Moon, offset down-left — the crescent is left top-right, as it will be. */
      .moon {
        position: absolute;
        left: 737px; top: 161px;
        width: 190px; height: 190px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: #101526;
      }

      .skyline {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 190px;
        background: #05070d;
        clip-path: polygon(
          0 78%, 4% 78%, 4% 60%, 9% 60%, 9% 74%, 14% 74%, 14% 44%, 18% 44%,
          18% 70%, 23% 70%, 23% 55%, 27% 55%, 27% 80%, 33% 80%, 33% 33%,
          37% 33%, 37% 66%, 42% 66%, 42% 52%, 47% 52%, 47% 76%, 53% 76%,
          53% 40%, 58% 40%, 58% 68%, 63% 68%, 63% 58%, 68% 58%, 68% 82%,
          74% 82%, 74% 47%, 79% 47%, 79% 71%, 84% 71%, 84% 62%, 89% 62%,
          89% 79%, 95% 79%, 95% 54%, 100% 54%, 100% 100%, 0 100%
        );
      }

      .skyline-rim {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 190px;
        background: rgba(255, 196, 128, 0.55);
        clip-path: polygon(
          0 78%, 4% 78%, 4% 60%, 9% 60%, 9% 74%, 14% 74%, 14% 44%, 18% 44%,
          18% 70%, 23% 70%, 23% 55%, 27% 55%, 27% 80%, 33% 80%, 33% 33%,
          37% 33%, 37% 66%, 42% 66%, 42% 52%, 47% 52%, 47% 76%, 53% 76%,
          53% 40%, 58% 40%, 58% 68%, 63% 68%, 63% 58%, 68% 58%, 68% 82%,
          74% 82%, 74% 47%, 79% 47%, 79% 71%, 84% 71%, 84% 62%, 89% 62%,
          89% 79%, 95% 79%, 95% 54%, 100% 54%, 100% 100%, 0 100%
        );
        transform: translateY(-3px);
        filter: blur(0.4px);
      }

      .content { position: absolute; left: 64px; top: 92px; max-width: 620px; }

      h1 {
        font-size: 68px;
        line-height: 1.04;
        letter-spacing: -0.035em;
        font-weight: 700;
      }

      .sub {
        margin-top: 20px;
        font-size: 27px;
        color: #ffc98a;
        font-weight: 500;
      }

      .blurb {
        margin-top: 22px;
        font-size: 23px;
        line-height: 1.45;
        color: #a7b2c9;
        max-width: 560px;
      }

      .url {
        position: absolute;
        left: 64px; bottom: 34px;
        font-size: 22px;
        color: #ffb84d;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow"></div>
      <div class="eclipse"></div>
      <div class="moon"></div>
      <div class="skyline-rim"></div>
      <div class="skyline"></div>

      <div class="content">
        <h1>Will I see<br />the eclipse?</h1>
        <p class="sub">Partial solar eclipse &middot; 12 August 2026</p>
        <p class="blurb">
          The Sun will be barely 10&deg; above the horizon. Check whether the hills
          and buildings around you let you see it — and watch the view from your spot.
        </p>
      </div>

      <div class="url">eclipse.hammantlabs.com</div>
    </div>
  </body>
</html>
