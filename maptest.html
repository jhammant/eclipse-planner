<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>map harness</title>
    <script>
      // Chrome throttles requestAnimationFrame to zero in hidden/background tabs,
      // which stalls MapLibre's render loop. Shim it BEFORE MapLibre is imported
      // so the map can be verified in an automated (hidden) tab.
      window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
      window.cancelAnimationFrame = (id) => clearTimeout(id);
    </script>
    <style>
      html, body { margin: 0; background: #111; }
      #map { width: 900px; height: 520px; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import { MapLibreMap } from 'maplibre-gl';
      import 'maplibre-gl/dist/maplibre-gl.css';

      const status = { events: [], tiles: 0 };
      window.__status = status;

      const map = new MapLibreMap({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty',
        center: [-0.13, 51.5944],
        zoom: 14,
        pitch: 60,
        bearing: 101,
        maxPitch: 85,
      });

      map.on('error', (e) => status.events.push('ERR: ' + (e.error?.message ?? '?')));
      map.on('load', () => {
        status.events.push('LOAD');
        map.addSource('terrarium', {
          type: 'raster-dem',
          tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
          tileSize: 256,
          encoding: 'terrarium',
          maxzoom: 13,
        });
        map.setTerrain({ source: 'terrarium', exaggeration: 1.3 });
        status.events.push('TERRAIN_SET');
      });
      map.on('idle', () => {
        status.idle = true;
        status.rendered = map.queryRenderedFeatures().length;
      });
      window.__map = map;
    </script>
  </body>
</html>
